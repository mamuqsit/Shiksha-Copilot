# Simple workflow for deploying static content
name: CI/CD Frontend

on:
  workflow_call:
    inputs:
      deploy_name:
        description: "Name of the deployment"
        required: true
        type: string
      environment:
        description: "Environment to build the frontend for"
        required: true
        type: string
      api_url:
        description: "Backend API URL this frontend resource must call"
        required: true
        type: string
      pages_subdir:
        description: "Subdirectory under the Pages site to publish into (feature-branch previews). Empty = site root (staging)."
        required: false
        type: string
        default: ""
      deploy_target:
        description: "Deployment target: 'github-pages' or 'azure-swa'. Leave blank to skip deployment."
        required: false
        type: string
        default: ""
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN:
        description: "Azure static web app deployment token (required when deploy_target is 'azure-swa')"
        required: false
    outputs:
      page_url:
        description: "GitHub Pages deployment URL (empty when not deployed)"
        value: ${{ jobs.build.outputs.page_url }}

permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.deploy_target != '' && inputs.deploy_name }}
      url: ${{ inputs.deploy_target == 'github-pages' && steps.ctx.outputs.page_url }}

    outputs:
      page_url: ${{ steps.ctx.outputs.page_url || steps.set-azure-url.outputs.page_url }}

    env:
      BACKEND_URL: ${{ inputs.api_url }}
      SHIKSHA_COPILOT_BUILD: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shiksha-website/shiksha-frontend/package-lock.json

      - name: Compute Pages context
        if: inputs.deploy_target == 'github-pages'
        id: ctx
        run: |
          sub='${{ inputs.pages_subdir }}'
          sub="${sub//\//-}"               # branch names may contain '/', not path-safe
          if [ -n "$sub" ]; then
            bh="/Shiksha-Copilot/$sub/"
          else
            bh="/Shiksha-Copilot/"
          fi
          echo "subdir=$sub" >> "$GITHUB_OUTPUT"
          echo "base_href=$bh" >> "$GITHUB_OUTPUT"
          echo "page_url=https://${{ github.repository_owner }}.github.io$bh" >> "$GITHUB_OUTPUT"

      - name: Build Angular app
        working-directory: shiksha-website/shiksha-frontend
        run: |
          if [ "${{ inputs.deploy_target }}" != "" ]; then
            find src/environments -name "environment*.ts" -print \
              -exec sed -i "s|your_backend_url|${BACKEND_URL}|g" {} \;
          fi

          npm ci
          if [ "${{ inputs.deploy_target }}" == "github-pages" ]; then
            npm run build -- --configuration ${{ inputs.environment }} \
              --base-href "${{ steps.ctx.outputs.base_href }}"
          else
            npm run build -- --configuration ${{ inputs.environment }}
          fi

      # keep_files: true so a preview deploy into a subdir doesn't wipe the staging
      # root (and vice-versa). ponytail: stale root files are never pruned; add a
      # full-clean staging deploy if that ever matters.
      - name: Deploy to GitHub Pages (gh-pages branch)
        if: inputs.deploy_target == 'github-pages'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: shiksha-website/shiksha-frontend/dist/shiksha-frontend
          destination_dir: ${{ steps.ctx.outputs.subdir }}
          keep_files: true

      - name: Deploy to Azure Static Web App
        id: deploy-azure-swa
        if: inputs.deploy_target == 'azure-swa'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: shiksha-website/shiksha-frontend/dist/shiksha-frontend
          skip_app_build: true
          output_location: ""